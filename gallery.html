    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divine Gallery | Kailash & Art</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lora:ital@0;1&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-dark: #0a0a0a;
            --accent-gold: #d4af37;
            --text-light: #e0e0e0;
            --kailash-silver: #b0c4de;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Lora', serif; background-color: var(--primary-dark); color: var(--text-light); line-height: 1.6; }
        h1, h2, h3 { font-family: 'Cinzel', serif; color: var(--accent-gold); }
        nav { display: flex; justify-content: space-between; align-items: center; padding: 1rem 5%; background: rgba(10, 10, 10, 0.9); position: fixed; width: 100%; top: 0; z-index: 1000; border-bottom: 1px solid #333; }
        .logo-container { display: flex; align-items: center; gap: 15px; }
        .logo-container img { height: 60px; width: 60px; border-radius: 50%; border: 2px solid var(--accent-gold); object-fit: cover; }
        .nav-links { display: flex; gap: 20px; flex-wrap: wrap; }
        .nav-links a { color: var(--text-light); text-decoration: none; font-family: 'Cinzel', serif; transition: color 0.3s; }
        .nav-links a:hover { color: var(--accent-gold); }
        .section { padding: 120px 5% 80px 5%; text-align: center; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; margin-top: 40px; }
        
        .art-card { 
            background: #1a1a1a; 
            padding: 15px; 
            border-radius: 8px; 
            border: 1px solid #333; 
            transition: transform 0.3s, border-color 0.3s; 
            cursor: pointer;
            text-align: left;
        }
        .art-card:hover { 
            transform: translateY(-10px); 
            border-color: var(--accent-gold); 
        }
        .art-card img { width: 100%; height: 350px; object-fit: cover; border-radius: 5px; }
        .art-card h3 { margin-top: 15px; font-size: 1.2rem; }
        .art-card p { font-size: 0.9rem; color: #25D366; margin-top: 8px; font-family: sans-serif; font-weight: bold; }

        footer { text-align: center; padding: 20px; background: #050505; border-top: 1px solid #333; margin-top: 50px; }
    </style>
</head>
<body>
    <nav>
        <div class="logo-container">
            <img src="1000716208.jpg" alt="Logo">
            <h3>Kailash & Art</h3>
        </div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="gallery.html" style="color: var(--accent-gold);">Gallery</a>
            <a href="instagram.html">Instagram Reels</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>

    <section class="section">
        <h2>Divine Gallery</h2>
        <p style="color: var(--kailash-silver);">Click on any artwork to inquire about it directly via WhatsApp</p>
        <div id="dynamic-gallery" class="gallery-grid">
            <p>Loading artworks automatically...</p>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Omkar Vibhute | Kailash & Art. All Rights Reserved.</p>
    </footer>

    <script>
        const githubUsername = 'Omkar-artist'; 
        const githubRepoName = 'kailash-and-art'; 
        const folderPath = 'images/artworks';
        const whatsappNumber = '919373787883'; // Your WhatsApp Number

        async function fetchGitHubGallery() {
            const apiUrl = `https://api.github.com/repos/${githubUsername}/${githubRepoName}/contents/${folderPath}`;
            const galleryGrid = document.getElementById('dynamic-gallery');

            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error('Network response was not ok');
                
                const data = await response.json();
                galleryGrid.innerHTML = ''; 

                data.forEach(item => {
                    if(item.name.match(/\.(jpe?g|png|gif)$/i)) {
                        let title = item.name.split('.')[0].replace(/-/g, ' ');
                        // Format title for nice capitalization
                        let formattedTitle = title.charAt(0).toUpperCase() + title.slice(1);
                        
                        let whatsappUrl = `https://wa.me/${whatsappNumber}?text=` + encodeURIComponent(`Hello Omkar, I saw your artwork "${formattedTitle}" on your website and I'm interested in it!`);

                        const artCard = document.createElement('div');
                        artCard.className = 'art-card';
                        artCard.onclick = function() {
                            window.open(whatsappUrl, '_blank');
                        };
                        artCard.innerHTML = `
                            <img src="${item.download_url}" alt="${formattedTitle}">
                            <h3>${formattedTitle}</h3>
                            <p>💬 Click to inquire on WhatsApp</p>
                        `;
                        galleryGrid.appendChild(artCard);
                    }
                });
            } catch (error) {
                galleryGrid.innerHTML = `<p style="color: #888;">Could not load gallery. Check your folder structure in GitHub.</p>`;
            }
        }
        document.addEventListener('DOMContentLoaded', fetchGitHubGallery);
    </script>
</body>
</html>
